name: Release

# Builds the signed release APK and AAB. A pushed `v*` tag also publishes a GitHub
# release with both attached; a manual run only uploads them as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # A tag that disagrees with versionName would publish a release whose APK reports
      # a different version in Settings > Apps.
      - name: Check the tag matches versionName
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version_name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version_name} in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UNIREMOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Secret UNIREMOTE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/uniremote-release.jks"

      - name: Run unit tests
        run: ./gradlew --stacktrace test

      # app/build.gradle.kts reads these as Gradle properties; ORG_GRADLE_PROJECT_* keeps
      # the passwords out of the command line.
      - name: Assemble signed APK and AAB
        env:
          ORG_GRADLE_PROJECT_UNIREMOTE_STORE_FILE: ${{ runner.temp }}/uniremote-release.jks
          ORG_GRADLE_PROJECT_UNIREMOTE_STORE_PASSWORD: ${{ secrets.UNIREMOTE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_UNIREMOTE_KEY_ALIAS: ${{ secrets.UNIREMOTE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_UNIREMOTE_KEY_PASSWORD: ${{ secrets.UNIREMOTE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease bundleRelease

      # Signing silently falls back to unsigned when the keystore is missing, so prove
      # the artifact is signed before it is published.
      - name: Verify the APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "${apk}" ]; then
            echo "::error::Signed APK not found; the release signing config was not applied"
            ls app/build/outputs/apk/release/
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${apk}"

      - name: Name the artifacts after the version
        id: artifacts
        run: |
          version_name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/UniRemote-v${version_name}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/UniRemote-v${version_name}.aab"
          echo "version=${version_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uniremote-release-v${{ steps.artifacts.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "UniRemote ${GITHUB_REF_NAME}" --generate-notes

      - name: Remove the keystore
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/uniremote-release.jks"
